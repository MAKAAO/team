plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
android {
    namespace "com.aao.team"
    compileSdk 35
    defaultConfig {
        applicationId "com.aao.team"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }
    flavorDimensions += "role"
    productFlavors {
        staff {
            dimension "role"
            applicationIdSuffix ".staff"
            resValue "string", "app_name", "Team Work Staff"
            buildConfigField "String", "APP_ROLE", '"staff"'
        }
        admin {
            dimension "role"
            applicationIdSuffix ".admin"
            resValue "string", "app_name", "Team Work Admin"
            buildConfigField "String", "APP_ROLE", '"admin"'
        }
    }
    buildFeatures { buildConfig true }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}
dependencies {
    implementation "org.jitsi.react:jitsi-meet-sdk:13.1.1"
}
